<main class="container">
<section class="intereses">
    <h2>Mis Intereses</h2>
    <ul>
        @for (interes of intereses; track interes) {
        <li [ngClass]="{'interes-destacado': interes.destacado}">
            {{interes.nombre | agregarEmoji}}
        </li>
        }
    </ul>
</section>
</main>
